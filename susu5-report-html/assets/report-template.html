body[data-theme="oriental-ink"] .shell{max-width:1100px}
.hero-ink{display:grid;grid-template-columns:auto 1fr;gap:56px;padding:64px 0 48px;border-bottom:1px solid var(--border)}
.ink-title-strip{writing-mode:vertical-rl;margin:0;border:1px solid var(--blue);color:var(--blue);padding:18px 10px;font-family:"KaiTi","STKaiti","SimSun",serif;font-size:22px;letter-spacing:.25em;align-self:start}
.hero-ink h1{font-family:"KaiTi","STKaiti","SimSun",serif;font-size:clamp(40px,4.8vw,60px);line-height:1.45;font-weight:500;max-width:16ch}
.hero-ink .verdict{background:transparent;border:0;padding:16px 0;max-width:60ch;font-weight:400;font-size:21px}
.hero-ink .hero-metric dd{font-size:48px;font-weight:500;color:var(--blue)}
body[data-theme="oriental-ink"] h2{font-family:"Songti SC","SimSun",serif;font-size:28px;font-weight:500}
body[data-theme="oriental-ink"] .panel{border:0;border-bottom:1px solid var(--border);padding:42px 0}
body[data-theme="oriental-ink"] .conclusion-grid{display:block}
body[data-theme="oriental-ink"] .conclusion-card{border:0;border-bottom:1px solid var(--border);padding:24px 0}
body[data-theme="oriental-ink"] .strong-number{font-size:26px}
body[data-theme="oriental-ink"] .evidence-pair{grid-template-columns:1fr;gap:16px;margin-bottom:44px}
body[data-theme="oriental-ink"] .chart-card{border:0;border-left:1px solid var(--blue);padding:12px 24px}
body[data-theme="oriental-ink"] th,body[data-theme="oriental-ink"] td{padding-top:18px;padding-bottom:18px}
body[data-theme="oriental-ink"] thead th{background:transparent;border-bottom:2px solid var(--border)}
.hero-noir:has(.hero-visual:empty) .noir-stage,.hero-swiss:has(.hero-visual:empty) .swiss-grid,.hero-blueprint:has(.hero-visual:empty) .blueprint-grid,.hero-pop:has(.hero-visual:empty) .pop-grid{grid-template-columns:1fr}
@media(max-width:1000px){.evidence-pair{grid-template-columns:1fr}.swiss-grid,.blueprint-grid,.noir-stage{gap:24px}.hero-consulting{min-height:0}body[data-theme="data-pop"] .conclusion-grid{grid-template-columns:1fr}body[data-theme="data-pop"] .conclusion-card{border-right:0;border-bottom:2px solid var(--text)}body[data-theme="data-pop"] .conclusion-card:last-child{border-bottom:0}}
@media(max-width:650px){
 .shell{width:calc(100% - 32px)}
 h1{font-size:30px;overflow-wrap:anywhere}h2{font-size:23px}
 .swiss-grid,.blueprint-grid,.noir-stage,.pop-grid,.hero-comparison{grid-template-columns:1fr}
 .hero-comparison{gap:12px}.noir-stage{margin:26px 0}.hero-ink{grid-template-columns:1fr;gap:24px;padding-top:30px}
 .ink-title-strip{writing-mode:horizontal-tb;font-size:17px;justify-self:start;letter-spacing:.1em;padding:8px 12px}
 .hero-consulting{padding:24px}.hero-consulting h1{margin-top:28px}.hero-consulting .hero-metric dd{font-size:48px}
 body[data-theme="engineering-blueprint"] .report-header{padding:18px}
 body[data-theme="engineering-blueprint"] #report-body{padding-left:16px}
 body[data-theme="engineering-blueprint"] #report-body>.panel:before{left:-24px}
 body[data-theme="data-pop"] .panel{padding:18px}
 .hero-pop .hero-title,.hero-pop .hero-visual{padding:24px}
 .hero-pop .hero-visual{border-left:0;border-top:2px solid var(--text)}
 .hero-pop>.meta,.hero-pop .verdict{padding:18px}
 body[data-theme="swiss-impact"] .conclusion-card{grid-template-columns:32px 1fr;column-gap:14px}
 body[data-theme="swiss-impact"] .conclusion-card:before{font-size:24px}
 .flow-track{grid-template-columns:1fr}
 th,td{padding:10px 7px;overflow-wrap:anywhere}table{font-size:16px}thead th{font-size:15px}
 .panel,.chart-card,.conclusion-card{padding:18px 14px}
 body[data-theme="light-glass"] .panel,body[data-theme="dark-analytics"] .panel{padding:18px 14px}
 .chart-card{padding:16px}.nav{gap:12px 20px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}

</style>
</head>
<body data-theme="{{REPORT_THEME}}" data-report-kind="{{REPORT_KIND}}">
<div class="shell">
<header class="report-header">
<p class="eyebrow">{{REPORT_TYPE}}</p>
<h1>{{REPORT_TITLE}}</h1>
<div class="meta">{{REPORT_META}}</div>
<p class="verdict">{{ONE_SENTENCE_CONCLUSION}}</p>
</header>
<nav class="nav" aria-label="报告章节"><a href="#summary">核心结论</a><a href="#report-body">依据与解释</a><a href="#notes">来源与口径</a></nav>
<main>
<section class="panel" id="summary" aria-labelledby="summary-title">
<div class="section-head"><p class="section-kicker">01 · 判断与条件</p><h2 id="summary-title">{{SUMMARY_TITLE}}</h2><p class="section-summary">{{SUMMARY_SCOPE}}</p></div>
{{SUMMARY_CONTENT}}
</section>
<div id="report-body">{{REPORT_SECTIONS}}</div>
<section class="panel" id="notes"><div class="section-head"><h2>{{NOTES_TITLE}}</h2></div>{{DETAIL_SECTIONS}}</section>
</main>
<footer>数据来源：{{DATA_SOURCES}}<br>生成日期：{{GENERATED_DATE}} · 版本：{{REPORT_VERSION}}</footer>
</div>
</body>
</html>
