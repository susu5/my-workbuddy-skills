00名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u pan>\u003cspan>统计截至：2026年9月30日\u003c/span>\u003cspan>数据范围：2,000名虚构客户\u003c/span>\u003c/div>\n\u003c/header>\n\n\u003cnav class=\"nav\" aria-label=\"报告章节\">\u003ca href=\"#summary\">核心结论\u003c/a>\u003ca href=\"#report-body\">依据与解释\u003c/a>\u003ca href=\"#notes\">来源与口径\u003c/a>\u003c/nav>\n\u003cmain>\n\u003csection class=\"panel\" id=\"summary\">\u003cdiv class=\"section-head\">\u003cp class=\"section-kicker\">01 · 判断与条件\u003c/p>\u003ch2>先看总体差别与判断条件\u003c/h2>\u003cp class=\"section-summary\">精确人数与分组证据随后展开；本页用于比较模板构图。\u003c/p>\u003c/div>\u003cdiv class=\"conclusion-grid\">\u003carticle class=\"conclusion-card\">\u003ch3>方案甲：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">8.0%\u003c/p>\u003cp class=\"note\">80名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:50%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>首次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-1\">\u003ccaption>首次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">32\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">16\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>4.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-1\">\u003cfigcaption>首次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">4.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:40%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>再次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-2\">\u003ccaption>再次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">600\u003c/td>\u003ctd class=\"number\">48\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">600\u003c/td>\u003ctd class=\"number\">34\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.7%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-2\">\u003cfigcaption>再次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.7%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:57%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"interpretation\">\u003cdiv class=\"section-head\">\u003ch2>看到差异，还要检查比较条件\u003c/h2>\u003c/div>\u003cp>两组客户可能来自不同渠道，也可能在咨询阶段、观察时间或参与方式上存在差异。真实报告应说明这些条件，再判断结果能支持多强的结论。\u003c/p>\u003cp class=\"callout is-uncertain\">\u003cstrong>需要确认：\u003c/strong>样本是否可比、观察时间是否一致。不能把“比例较高”直接写成“方案带来了提升”。\u003c/p>\u003c/section>\n\n\u003c/div>\n\u003csection class=\"panel\" id=\"notes\">\u003cdiv class=\"section-head\">\u003ch2>数据说明\u003c/h2>\u003c/div>\u003cp>所有方案、人数和比例均为虚构示例；不对应任何真实客户或项目。\u003c/p>\u003cdetails>\u003csummary>展开：缺失数据与零值的写法\u003c/summary>\u003ctable id=\"missing-example\">\u003cthead>\u003ctr>\u003cth scope=\"col\">数据状态\u003c/th>\u003cth scope=\"col\">显示内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>尚未提供结果\u003c/td>\u003ctd class=\"is-insufficient\">未提供\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已确认无人买单\u003c/td>\u003ctd class=\"number\">0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"note\">“未提供”表示缺少记录，“0”表示已有记录且数值为零，二者不能互换。\u003c/p>\u003c 果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width: v class=\"hero-title\">\u003ch1>服务方案与买单情况\u003c/h1>\u003cdiv class=\"meta\">\u003cspan>数据日期：2026年9月\u003c/span>\u003cspan>统计截至：2026年9月30日\u003c/span>\u003cspan>数据范围：2,000名虚构客户\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cp class=\"verdict\">示例中方案甲的买单比例较高；这些虚构数据仅用于展示排版，不用于判断真实业务效果。\u003c/p>\n\u003c/header>\n\n\u003cnav class=\"nav\" aria-label=\"报告章节\">\u003ca href=\"#summary\">核心结论\u003c/a>\u003ca href=\"#report-body\">依据与解释\u003c/a>\u003ca href=\"#notes\">来源与口径\u003c/a>\u003c/nav>\n\u003cmain>\n\u003csection class=\"panel\" id=\"summary\">\u003cdiv class=\"section-head\">\u003cp class=\"section-kicker\">01 · 判断与条件\u003c/p>\u003ch2>先看总体差别与判断条件\u003c/h2>\u003cp class=\"section-summary\">精确人数与分组证据随后展开；本页用于比较模板构图。\u003c/p>\u003c/div>\u003cdiv class=\"conclusion-grid\">\u003carticle class=\"conclusion-card\">\u003ch3>方案甲：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">8.0%\u003c/p>\u003cp class=\"note\">80名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scop >\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">600\u003c/td>\u003ctd class=\"number\">34\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.7%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-2\">\u003cfigcaption>再次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.7%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:57%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"interpretation\">\u003cdiv class=\"section-head\">\u003ch2>看到差异，还要检查比较条件\u003c/h2>\u003c/div>\u003cp>两组客户可能来自不同渠道，也可能在咨询阶段、观察时间或参与方式上存在差异。真实报告应说明这些条件，再判断结果能支持多强的结论。\u003c/p>\u003cp class=\"callout is-uncertain\">\u003cstrong>需要确认：\u003c/strong>样本是否可比、观察时间是否一致。不能把“比例较高”直接写成“方案带来了提升”。\u003c/p>\u003c/section>\n\n\u003c/div>\n\u003csection class=\"panel\" id=\"notes\">\u003cdiv class=\"section-head\">\u003ch2>数据说明\u003c/h2>\u003c/div>\u003cp>所有方案、人数和比例均为虚构示例；不对应任何真实客户或项目。\u003c/p>\u003cdetails>\u003csummary>展开：缺失数据与零值的写法\u003c/summary>\u003ctable id=\"missing-example\">\u003cthead>\u003ctr>\u003cth scope=\"col\">数据状态\u003c/th>\u003cth scope=\"col\">显示内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>尚未提供结果\u003c/td>\u003ctd class=\"is-insufficient\">未提供\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已确认无人买单\u003c/td>\u003ctd class=\"number\">0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"note\">“未提供”表示缺少记录，“0”表示已有记录且数值为零，二者不能互换。\u003c/p>\u003c/details>\u003c/section>\n\u003c/main>\n\u003cfooter>数据来源：虚构数据，仅供风格预览\u003cbr>生成日期：2026年10月8日 · 版本：风格实样 v3.0.0\u003c/footer>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "data-pop": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"generator\" content=\"susu5-report-html v3.0.0\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>服务方案与买单情况\u003c/title>\n\u003cstyle>\n:root {\n  --page-bg:#fff; --panel:#fff; --text:#202f40; --muted:#536478;\n  --border:#d4dde7; --head-bg:#eef3f9; --stripe:#f7f9fc;\n  --blue:#205cad; --purple:#7050a0; --blue-soft:#edf4ff;\n  --red:#a82e3b; --red-soft:#fff0f1; --green:#176842; --green-soft:#edf8f2;\n  --yellow:#795500; --yellow-soft:#fff5d7; --insufficient:#536478;\n  --radius:2px; --panel-pad:26px; --chart-columns:1fr;\n}\nbody[data-theme=\"clean-table\"] {\n  --page-bg:#fff; --panel:#fff; --text:#202f40; --muted:#536478;\n  --border:#ccd7e3; --head-bg:#edf2f8; --stripe:#f7f9fc;\n  --blue:#205cad; --purple:#7050a0; --radius:2px; --chart-columns:1fr;\n}\nbody[data-theme=\"light-glass\"] {\n  --page-bg:#f2f5fa; --panel:#fff; --text:#202b3d; --muted:#536176;\n  --border:#d5deeb; --head-bg:#edf2fb; --stripe:#f7f9fd;\n  --blue:#255bc4; --purple:#744ba7; --blue-soft:#eef3ff;\n  --radius:12px; --chart-columns:repeat(2,minmax(0,1fr));\n}\nbody[data-theme=\"editorial-brief\"] {\n  --page-bg:#faf7f0; --panel:#faf7f0; --text:#332e28; --muted:#6b5f50;\n  --border:#d4c9b9; --head-bg:#efe9df; --stripe:#f5f0e7;\n  --blue:#315977; --purple:#805077; --blue-soft:#eaf0f2;\n  --red:#a13435; --red-soft:#fbe9e6; --green:#276341; --green-soft:#e9f3ea;\n  --yellow:#765115; --yellow-soft:#f5eacd; --insufficient:#6b5f50;\n  --radius:0px; --panel-pad:28p x 1fr;column-gap:14px}\n body[data-theme=\"swiss-impact\"] .conclusion-card:before{font-size:24px}\n .flow-track{grid-template-columns:1fr}\n th,td{padding:10px 7px;overflow-wrap:anywhere}table{font-size:16px}thead th{font-size:15px}\n .panel,.chart-card,.conclusion-card{padding:18px 14px}\n body[data-theme=\"light-glass\"] .panel,body[data-theme=\"dark-analytics\"] .panel{padding:18px 14px}\n .chart-card{padding:16px}.nav{gap:12px 20px}\n}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}\n\n\u003c/style>\n\u003c/head>\n\u003cbody data-theme=\"data-pop\" data-report-kind=\"evidence-report\">\n\u003cdiv class=\"shell\">\n\u003cheader class=\"report-header hero-pop\">\n\u003cp class=\"eyebrow\">证据分析 · 虚构示例\u003c/p>\u003cdiv class=\"pop-grid\">\u003cdiv class=\"hero-title\">\u003ch1>服务方案与买单情况\u003c/h1>\u003c/div>\u003cdiv class=\"hero-visual\">\u003cdl class=\"hero-metric\">\u003cdt>方案甲 · 总体买单比例\u003c/dt>\u003cdd>8.0%\u003c/dd>\u003c/dl>\u003cp class=\"note\">80名买单客户 / 1,000名客户\u003cbr>2026年9月 · 虚构示例；样本可比性待确认\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"meta\">\u003cspan>数据日期：2026年9月\u003c/span>\u003cspan>统计截至：2026年9月30日\u003c/span>\u003cspan>数据范围：2,000名虚构客户\u003c/span>\u003c/div>\u003cp class=\"verdict\">示例中方案甲的买单比例较高；这些虚构数据仅用于展示排版，不用于判断真实业务效果。\u003c/p>\n\u003c/header>\n\n\u003cnav class=\"nav\" aria-label=\"报告章节\">\u003ca href=\"#summary\">核心结论\u003c/a>\u003ca href=\"#report-body\">依据与解释\u003c/a>\u003ca href=\"#notes\">来源与口径\u003c/a>\u003c/nav>\n\u003cmain>\n\u003csection class=\"panel\" id=\"summary\">\u003cdiv class=\"section-head\">\u003cp class=\"section-kicker\">01 · 判断与条件\u003c/p>\u003ch2>先看总体差别与判断条件\u003c/h2>\u003cp class=\"section-summary\">精确人数与分组证据随后展开；本页用于比较模板构图。\u003c/p>\u003c/div>\u003cdiv class=\"conclusion-grid\">\u003carticle class=\"conclusion-card\">\u003ch3>方案甲：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">8.0%\u003c/p>\u003cp class=\"note\">80名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:50%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>首次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-1\">\u003ccaption>首次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">32\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">16\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>4.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-1\">\u003cfigcaption>首次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u00 03cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"interpretation\">\u003cdiv class=\"section-head\">\u003ch2>看到差异，还要检查比较条件\u003c/h2>\u003c/div>\u003cp>两组客户可能来自不同渠道，也可能在咨询阶段、观察时间或参与方式上存在差异。真实报告应说明这些条件，再判断结果能支持多强的结论。\u003c/p>\u003cp class=\"callout is-uncertain\">\u003cstrong>需要确认：\u003c/strong>样本是否可比、观察时间是否一致。不能把“比例较高”直接写成“方案带来了提升”。\u003c/p>\u003c/section>\n\n\u003c/div>\n\u003csection class=\"panel\" id=\"notes\">\u003cdiv class=\"section-head\">\u003ch2>数据说明\u003c/h2>\u003c/div>\u003cp>所有方案、人数和比例均为虚构示例；不对应任何真实客户或项目。\u003c/p>\u003cdetails>\u003csummary>展开：缺失数据与零值的写法\u003c/summary>\u003ctable id=\"missing-example\">\u003cthead>\u003ctr>\u003cth scope=\"col\">数据状态\u003c/th>\u003cth scope=\"col\">显示内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>尚未提供结果\u003c/td>\u003ctd class=\"is-insufficient\">未提供\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已确认无人买单\u003c/td>\u003ctd class=\"number\">0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"note\">“未提供”表示缺少记录，“0”表示已有记录且数值为零，二者不能互换。\u003c/p>\u003c/details>\u003c/section>\n\u003c/main>\n\u003cfooter>数据来源：虚构数据，仅供风格预览\u003cbr>生成日期：2026年10月8日 · 版本：风格实样 v3.0.0\u003c/footer>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "oriental-ink": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"generator\" content=\"susu5-report-html v3.0.0\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>服务方案与买单情况\u003c/title>\n\u003cstyle>\n:root {\n  --page-bg:#fff; --panel:#fff; --text:#202f40; --muted:#536478;\n  --border:#d4dde7; --head-bg:#eef3f9; --stripe:#f7f9fc;\n  --blue:#205cad; --purple:#7050a0; --blue-soft:#edf4ff;\n  --red:#a82e3b; --red-soft:#fff0f1; --green:#176842; --green-soft:#edf8f2;\n  --yellow:#795500; -- 003c/div>\u003cp class=\"verdict\">示例中方案甲的买单比例较高；这些虚构数据仅用于展示排版，不用于判断真实业务效果。\u003c/p>\u003cdiv class=\"hero-visual\">\u003cdl class=\"hero-metric\">\u003cdt>方案甲 · 总体买单比例\u003c/dt>\u003cdd>8.0%\u003c/dd>\u003c/dl>\u003cp class=\"note\">80名买单客户 / 1,000名客户\u003cbr>2026年9月 · 虚构示例；样本可比性待确认\u003c/p>\u003c/div>\u003c/div>\n\u003c/header>\n\n\u003cnav class=\"nav\" aria-label=\"报告章节\">\u003ca href=\"#summary\">核心结论\u003c/a>\u003ca href=\"#report-body\">依据与解释\u003c/a>\u003ca href=\"#notes\">来源与口径\u003c/a>\u003c/nav>\n\u003cmain>\n\u003csection class=\"panel\" id=\"summary\">\u003cdiv class=\"section-head\">\u003cp class=\"section-kicker\">01 · 判断与条件\u003c/p>\u003ch2>先看总体差别与判断条件\u003c/h2>\u003cp class=\"section-summary\">精确人数与分组证据随后展开；本页用于比较模板构图。\u003c/p>\u003c/div>\u003cdiv class=\"conclusion-grid\">\u003carticle class=\"conclusion-card\">\u003ch3>方案甲：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">8.0%\u003c/p>\u003cp class=\"note\">80名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:50%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>首次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-1\">\u003ccaption>首次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctb class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:50%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>首次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-1\">\u003ccaption>首次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">32\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">16\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>4.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-1\">\u003cfigcaption>首次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">4.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:40%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>再次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-2\">\u003ccaption>再次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">600\u003c/td>\u003ctd class=\"number\">48\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">600\u003c/td>\u003ctd class=\"number\">34\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.7%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-2\">\u003cfigcaption>再次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.7%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:57%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"interpretation\">\u003cdiv class=\"section-head\">\u003ch2>看到差异，还要检查比较条件\u003c/h2>\u003c/div>\u003cp>两组客户可能来自不同渠道，也可能在咨询阶段、观察时间或参与方式上存在差异。真实报告应说明这些条件，再判断结果能支持多强的结论。\u003c/p>\u003cp class=\"callout is-uncertain\">\u003cstrong>需要确认：\u003c/strong>样本是否可比、观察时间是否一致。不能把“比例较高”直接写成“方案带来了提升”。\u003c/p>\u003c/section>\n\n\u003c/div>\n\u003csection class=\"panel\" id=\"notes\">\u003cdiv class=\"section-head\">\u003ch2>数据说明\u003c/h2>\u003c/div>\u003cp>所有方案、人数和比例均为虚构示例；不对应任何真实客户或项目。\u003c/p>\u003cdetails>\u003csummary>展开：缺失数据与零值的写法\u003c/summary>\u003ctable id=\"missing-example\">\u003cthead>\u003ctr>\u003cth scope=\"col\">数据状态\u003c/th>\u003cth scope=\"col\">显示内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>尚未提供结果\u003c/td>\u003ctd class=\"is-insufficient\">未提供\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已确认无人买单\u003c/td>\u003ctd class=\"number\">0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"note\">“未提供”表示缺少记录，“0”表示已有记录且数值为零，二者不能互换。\u003c/p>\u003c/details>\u003c/section>\n\u003c/main>\n\u003cfooter>数据来源：虚构数据，仅供风格预览\u003cbr>生成日期：2026年10月8日 · 版本：风格实样 v3.0.0\u003c/footer>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "light-glass": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"generator\" content=\"susu5-report-html v3.0.0\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>服务方案与买单情况\u003c/title>\n\u003cstyle>\n:root {\n  --page-bg:#fff; --panel:#fff; --text:#202f40; --muted:#536478;\n  --border:#d4dde7; --head-bg:#eef3f9; --stripe:#f7f9fc;\n  --blue:#205cad; --purple:#7050a0; --blue-soft:#edf4ff;\n  --red:#a82e3b; --red-soft:#fff0f1; --green:#176842; --green-soft:#edf8f2;\n  --yellow:#795500; --yellow-soft:#fff5d7; --insufficient:#536478;\n  --radius:2px; --panel-pad:26px; --chart-columns: 甲 · 总体买单比例\u003c/dt>\u003cdd>8.0%\u003c/dd>\u003c/dl>\u003cp class=\"note\">80名买单客户 / 1,000名客户\u003cbr>2026年9月 · 虚构示例；样本可比性待确认\u003c/p>\n\u003c/header>\n\n\u003cnav class=\"nav\" aria-label=\"报告章节\">\u003ca href=\"#summary\">核心结论\u003c/a>\u003ca href=\"#report-body\">依据与解释\u003c/a>\u003ca href=\"#notes\">来源与口径\u003c/a>\u003c/nav>\n\u003cmain>\n\u003csection class=\"panel\" id=\"summary\">\u003cdiv class=\"section-head\">\u003cp class=\"section-kicker\">01 · 判断与条件\u003c/p>\u003ch2>先看总体差别与判断条件\u003c/h2>\u003cp class=\"section-summary\">精确人数与分组证据随后展开；本页用于比较模板构图。\u003c/p>\u003c/div>\u003cdiv class=\"conclusion-grid\">\u003carticle class=\"conclusion-card\">\u003ch3>方案甲：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">8.0%\u003c/p>\u003cp class=\"note\">80名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u0 03c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.0%\u003c/strong>\u003c/div>\u003cdiv c on\">\u003cdiv class=\"section-head\">\u003ch2>看到差异，还要检查比较条件\u003c/h2>\u003c/div>\u003cp>两组客户可能来自不同渠道，也可能在咨询阶段、观察时间或参与方式上存在差异。真实报告应说明这些条件，再判断结果能支持多强的结论。\u003c/p>\u003cp class=\"callout is-uncertain\">\u003cstrong>需要确认：\u003c/strong>样本是否可比、观察时间是否一致。不能把“比例较高”直接写成“方案带来了提升”。\u003c/p>\u003c/section>\n\n\u003c/div>\n\u003csection class=\"panel\" id=\"notes\">\u003cdiv class=\"section-head\">\u003ch2>数据说明\u003c/h2>\u003c/div>\u003cp>所有方案、人数和比例均为虚构示例；不对应任何真实客户或项目。\u003c/p>\u003cdetails>\u003csummary>展开：缺失数据与零值的写法\u003c/summary>\u003ctable id=\"missing-example\">\u003cthead>\u003ctr>\u003cth scope=\"col\">数据状态\u003c/th>\u003cth scope=\"col\">显示内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>尚未提供结果\u003c/td>\u003ctd class=\"is-insufficient\">未提供\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已确认无人买单\u003c/td>\u003ctd class=\"number\">0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"note\">“未提供”表示缺少记录，“0”表示已有记录且数值为零，二者不能互换。\u003c/p>\u003c/details>\u003c/section>\n\u003c/main>\n\u003cfooter>数据来源：虚构数据，仅供风格预览\u003cbr>生成日期：2026年10月8日 · 版本：风格实样 v3.0.0\u003c/footer>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "dark-analytics": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"generator\" content=\"susu5-report-html v3.0.0\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>服务方案与买单情况\u003c/title>\n\u003cstyle>\n:root {\n  --page-bg:#fff; --panel:#fff; --text:#202f40; --muted:#536478;\n  --border:#d4dde7; --head-bg:#eef3f9; --stripe:#f7f9fc;\n  --blue:#205cad; --purple:#7050a0; --blue-soft:#edf4ff;\n  --red:#a82e3b; --red-soft:#fff0f1; --green:#176842; --green-soft:#edf8f2;\n  --yellow:#795500; --yellow-soft:#fff5d7; --insufficient:#536478;\n  --radius:2px; --panel-pad:26px; --chart-columns:1fr;\n}\nbody[data-theme=\"clean-table\"] {\n  --page-bg:#fff; --panel:#fff; --text:#202f40; --muted:#536478;\n  --border:#ccd7e3; --head-bg:#edf2f8; --stripe:#f7f9fc;\n lass=\"nav\" aria-label=\"报告章节\">\u003ca href=\"#summary\">核心结论\u003c/a>\u003ca href=\"#report-body\">依据与解释\u003c/a>\u003ca href=\"#notes\">来源与口径\u003c/a>\u003c/nav>\n\u003cmain>\n\u003csection class=\"panel\" id=\"summary\">\u003cdiv class=\"section-head\">\u003cp class=\"section-kicker\">01 · 判断与条件\u003c/p>\u003ch2>先看总体差别与判断条件\u003c/h2>\u003cp class=\"section-summary\">精确人数与分组证据随后展开；本页用于比较模板构图。\u003c/p>\u003c/div>\u003cdiv class=\"conclusion-grid\">\u003carticle class=\"conclusion-card\">\u003ch3>方案甲：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">8.0%\u003c/p>\u003cp class=\"note\">80名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>方案乙：总体买单比例\u003c/h3>\u003cspan class=\"metric-status\">虚构示例数据 · 2026年9月\u003c/span>\u003cp class=\"strong-number metric-primary\">5.0%\u003c/p>\u003cp class=\"note\">50名买单客户 / 1,000名客户。仅展示数值，不能判断真实业务效果。\u003c/p>\u003c/article>\u003carticle class=\"conclusion-card\">\u003ch3>比较结果的成立条件\u003c/h3>\u003cp>先核对样本与观察时间。\u003c/p>\u003cp class=\"note is-uncertain\">真实报告须确认两组客户是否可比；本页所有数据均为虚构。\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n\u003cdiv id=\"report-body\" class=\"evidence-body\">\n\u003csection class=\"panel\" id=\"evidence\">\u003cdiv class=\"section-head\">\u003ch2>总体与不同咨询阶段的差别是否一致？\u003c/h2>\u003c/div>\u003cp>买单比例＝买单人数÷客户人数。类别颜色区分方案，不表示好坏。三张图使用同一刻度。\u003c/p>\u003ch3>总体对比\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-0\">\u003ccaption>全部客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">80\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">1,000\u003c/td>\u003ctd class=\"number\">50\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-0\">\u003cfigcaption>总体对比：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:50%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>首次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-1\">\u003ccaption>首次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">32\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">400\u003c/td>\u003ctd class=\"number\">16\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>4.0%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-1\">\u003cfigcaption>首次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">4.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:40%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003ch3>再次咨询客户\u003c/h3>\u003cdiv class=\"evidence-pair\">\u003cdiv>\u003ctable id=\"comparison-2\">\u003ccaption>再次咨询客户 · 虚构示例，2026年9月\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">服务方案\u003c/th>\u003cth scope=\"col\" class=\"number\">客户人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单人数\u003c/th>\u003cth scope=\"col\" class=\"number\">买单比例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\" class=\"group-a\">方案甲\u003c/th>\u003ctd class=\"number\">600\u003c/td>\u003ctd class=\"number\">48\u003c/td>\u003ctd class=\"number group-a\">\u003cstrong>8.0%\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\" class=\"group-b\">方案乙\u003c/th>\u003ctd class=\"number\">600\u003c/td>\u003ctd class=\"number\">34\u003c/td>\u003ctd class=\"number group-b\">\u003cstrong>5.7%\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cfigure class=\"chart-card\" id=\"chart-2\">\u003cfigcaption>再次咨询客户：买单比例\u003c/figcaption>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-a\">方案甲\u003c/span>\u003cstrong class=\"group-a\">8.0%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-a\" style=\"width:80%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"bar-row\">\u003cdiv class=\"bar-label\">\u003cspan class=\"group-b\">方案乙\u003c/span>\u003cstrong class=\"group-b\">5.7%\u003c/strong>\u003c/div>\u003cdiv class=\"bar-track\" aria-hidden=\"true\">\u003cdiv class=\"bar-fill group-b\" style=\"width:57%\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"chart-scale\">\u003cspan>0%\u003c/span>\u003cspan>5%\u003c/span>\u003cspan>10%\u003c/span>\u003c/div>\u003cp class=\"note\">2026年9月 · 三张图使用同一刻度；具体人数见相邻表格。\u003c/p>\u003c/figure>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"interpretation\">\u003cdiv class=\"section-head\">\u003ch2>看到差异，还要检查比较条件\u003c/h2>\u003c/div>\u003cp>两组客户可能来自不同渠道，也可能在咨询阶段、观察时间或参与方式上存在差异。真实报告应说明这些条件，再判断结果能支持多强的结论。\u003c/p>\u003cp class=\"callout is-uncertain\">\u003cstrong>需要确认：\u003c/strong>样本是否可比、观察时间是否一致。不能把“比例较高”直接写成“方案带来了提升”。\u003c/p>\u003c/section>\n\n\u003c/div>\n\u003csection class=\"panel\" id=\"notes\">\u003cdiv class=\"section-head\">\u003ch2>数据说明\u003c/h2>\u003c/div>\u003cp>所有方案、人数和比例均为虚构示例；不对应任何真实客户或项目。\u003c/p>\u003cdetails>\u003csummary>展开：缺失数据与零值的写法\u003c/summary>\u003ctable id=\"missing-example\">\u003cthead>\u003ctr>\u003cth scope=\"col\">数据状态\u003c/th>\u003cth scope=\"col\">显示内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>尚未提供结果\u003c/td>\u003ctd class=\"is-insufficient\">未提供\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已确认无人买单\u003c/td>\u003ctd class=\"number\">0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"note\">“未提供”表示缺少记录，“0”表示已有记录且数值为零，二者不能互换。\u003c/p>\u003c/details>\u003c/section>\n\u003c/main>\n\u003cfooter>数据来源：虚构数据，仅供风格预览\u003cbr>生成日期：2026年10月8日 · 版本：风格实样 v3.0.0\u003c/foote
